<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TVBeli" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/tvbeli-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/tvbeli-icon.svg" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html, body, #root { height: 100%; }
      body { margin: 0; overflow: hidden; background: #08090C; overscroll-behavior-y: none; }
      #root { display: flex; flex: 1; }
      * { box-sizing: border-box; }
      button, [role="button"] { cursor: pointer; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run TVBeli.</noscript>
    <div id="root"></div>
  </body>
</html>
